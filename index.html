
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide to the Godpull</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root{
    --ink:#0b2b52;
    --paper:#eef6ff;
    --panel:#f7f3e8;
    --accent:#1ab8ff;
    --accent2:#ff6b6b;
    --line:4px;
    --board-max: 520px;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    background: #1f6fe0;
    color: var(--paper);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% 85%, rgba(255,255,255,0.35), transparent 60%),
      radial-gradient(ellipse 700px 400px at 85% 20%, rgba(255,255,255,0.28), transparent 60%),
      radial-gradient(ellipse 1200px 800px at 50% 100%, rgba(255,255,255,0.18), transparent 55%),
      linear-gradient(160deg, #0f57c9 0%, #1f78e6 35%, #3f9be8 70%, #8ed0f5 100%);
    background-attachment: fixed;
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom: 18px;
    border-bottom: var(--line) solid var(--paper);
    padding-bottom: 14px;
  }

  h1{
    font-family:'Permanent Marker', cursive;
    font-size: clamp(22px, 5vw, 34px);
    margin:0;
    letter-spacing: 1px;
    transform: rotate(-2deg);
    color: var(--paper);
    text-shadow: 3px 3px 0 var(--accent2);
  }

  .tagline{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:2px;
    opacity:0.6;
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }

  .size-group{
    display:flex;
    gap:6px;
    border: 3px solid var(--paper);
    padding:4px;
    border-radius: 8px;
  }

  button{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:14px;
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--paper);
    border-radius:5px;
    padding:8px 14px;
    cursor:pointer;
    transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease;
  }
  button:hover{ transform: translateY(-2px); }
  button:active{ transform: translateY(0px) scale(0.97); }

  .size-group button.active{
    background: var(--accent);
    color: var(--ink);
    border-color: var(--accent);
  }

  .new-game{
    background: var(--accent2);
    color: var(--ink);
    border-color: var(--accent2);
    font-family:'Permanent Marker', cursive;
    font-size:16px;
    padding:10px 18px;
  }

  .easy-toggle{
    background: transparent;
    color: var(--paper);
    border: 2px solid var(--paper);
    font-size:13px;
  }
  .easy-toggle.active{
    background: var(--accent);
    color: var(--ink);
    border-color: var(--accent);
  }

  .reference-panel{
    display:none;
    align-items:center;
    gap:12px;
    max-width: var(--board-max);
    margin: 0 auto 16px;
    background: var(--panel);
    color: var(--ink);
    border-radius: 10px;
    padding: 10px 14px;
    border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 rgba(11,43,82,0.35);
  }
  .reference-panel.show{ display:flex; }
  .reference-panel .ref-label{
    font-family:'Permanent Marker', cursive;
    font-size: 14px;
    letter-spacing: 1px;
    flex-shrink:0;
  }
  .reference-panel img{
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid var(--ink);
    margin-left:auto;
  }

  .stats{
    display:flex;
    gap:16px;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    opacity:0.85;
  }
  .stats b{
    font-family:'Permanent Marker', cursive;
    font-size:16px;
    color: var(--accent);
    display:block;
    letter-spacing:0;
  }

  .board-frame{
    position:relative;
    width:100%;
    max-width: var(--board-max);
    margin: 0 auto;
    aspect-ratio: 1 / 1;
    background: var(--panel);
    border: var(--line) solid var(--panel);
    border-radius:10px;
    padding: 8px;
    box-shadow: 8px 8px 0 rgba(11,43,82,0.35), 0 0 0 2px var(--ink) inset;
  }

  .board{
    position:relative;
    width:100%;
    height:100%;
    display:grid;
    gap:4px;
    background: var(--ink);
    border-radius:4px;
    overflow:hidden;
  }

  .tile{
    position:relative;
    width:100%;
    aspect-ratio: 1 / 1;
    background-color:#222;
    background-repeat:no-repeat;
    cursor:default;
    border-radius:3px;
    outline: 2px solid var(--ink);
    transition: filter 0.1s ease, transform 0.16s ease;
    touch-action: none;
    z-index: 1;
  }
  .tile.movable{
    cursor: grab;
    box-shadow: 0 0 0 2px var(--accent) inset;
  }
  .tile.movable:hover{ filter: brightness(1.15); outline-color: var(--accent); }
  .tile.dragging{
    cursor: grabbing;
    z-index: 5;
    transition: none;
    filter: brightness(1.2);
  }
  .tile.blank{
    background: transparent;
    cursor:default;
    outline:none;
    box-shadow:none;
  }
  .tile .num{
    position:absolute;
    top:2px; left:4px;
    font-size:10px;
    font-weight:700;
    color: #fff;
    background: rgba(0,0,0,0.55);
    padding:1px 4px;
    border-radius:3px;
    pointer-events:none;
  }

  .win-overlay{
    position:fixed;
    inset:0;
    background: rgba(0,0,0,0.82);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 50;
    text-align:center;
    padding:20px;
  }
  .win-overlay.show{ display:flex; flex-direction:column; }
  .win-card{
    background: var(--panel);
    color: var(--ink);
    border-radius:12px;
    padding: 30px 26px;
    max-width: 360px;
    margin: 0 auto;
    border: var(--line) solid var(--accent2);
  }
  .win-card h2{
    font-family:'Permanent Marker', cursive;
    font-size: 30px;
    margin: 0 0 8px;
    color: var(--accent2);
  }
  .win-card p{ margin:6px 0 18px; font-size:14px; }
  .win-card button{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  footer{
    text-align:center;
    font-size:11px;
    opacity:0.4;
    margin-top: 22px;
    letter-spacing:1px;
    text-transform:uppercase;
  }

  @media (max-width: 420px){
    .stats{ font-size:11px; gap:10px; }
    .tile .num{ font-size:8px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>SLIDE TO THE GODPULL</h1>
      </div>
      <div class="stats">
        <div><b id="moves">0</b>moves</div>
        <div><b id="timer">0:00</b>time</div>
      </div>
    </header>

    <div class="controls">
      <div class="size-group" id="sizeGroup">
        <button data-size="4" class="active">4×4</button>
        <button data-size="6">6×6</button>
        <button data-size="8">8×8</button>
      </div>
      <button class="easy-toggle" id="easyToggle">👁 EASY MODE: OFF</button>
      <button class="new-game" id="newGame">NEW ROUND ↻</button>
    </div>

    <div class="reference-panel" id="referencePanel">
      <span class="ref-label">MATCH THIS</span>
      <img id="refImg" alt="reference character" />
    </div>

    <div class="board-frame">
      <div class="board" id="board"></div>
    </div>

    <footer>drag a highlighted tile toward the gap — or just tap it</footer>
  </div>

  <div class="win-overlay" id="winOverlay">
    <div class="win-card">
      <h2>SOLVED!</h2>
      <p id="winStats">You did it.</p>
      <button id="playAgain">PLAY AGAIN</button>
    </div>
  </div>

  let gridSize = 4;
  let tiles = [];
  let blankIndex = 0;
  let moves = 0;
  let timerInterval = null;
  let seconds = 0;
  let solved = false;
  let currentImage = IMAGES[0];

  const boardEl = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timerEl = document.getElementById('timer');
  const winOverlay = document.getElementById('winOverlay');
  const winStats = document.getElementById('winStats');

  function pickRandomImage(){
    return IMAGES[Math.floor(Math.random() * IMAGES.length)];
  }

  function formatTime(s){
    const m = Math.floor(s/60);
    const r = s%60;
    return m + ':' + String(r).padStart(2,'0');
  }

  function startTimer(){
    stopTimer();
    seconds = 0;
    timerEl.textContent = formatTime(seconds);
    timerInterval = setInterval(() => {
      seconds++;
      timerEl.textContent = formatTime(seconds);
    }, 1000);
  }
  function stopTimer(){
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = null;
  }

  function buildSolvedArray(n){
    const total = n*n;
    const arr = [];
    for(let i=0;i<total;i++) arr.push(i); // last index (total-1) is blank
    return arr;
  }

  function getNeighbors(idx, n){
    const row = Math.floor(idx/n);
    const col = idx % n;
    const neighbors = [];
    if(row>0) neighbors.push(idx-n);
    if(row<n-1) neighbors.push(idx+n);
    if(col>0) neighbors.push(idx-1);
    if(col<n-1) neighbors.push(idx+1);
    return neighbors;
  }

  function shuffleFromSolved(n, shuffleMoves){
    let arr = buildSolvedArray(n);
    let blank = arr.length - 1;
    let lastMove = -1;
    for(let i=0;i<shuffleMoves;i++){
      const neighbors = getNeighbors(blank, n).filter(nb => nb !== lastMove);
      const pick = neighbors[Math.floor(Math.random()*neighbors.length)];
      [arr[blank], arr[pick]] = [arr[pick], arr[blank]];
      lastMove = blank;
      blank = pick;
    }
    return { arr, blank };
  }

  function renderBoard(){
    boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
    boardEl.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
    boardEl.innerHTML = '';

    tiles.forEach((value, pos) => {
      const tileEl = document.createElement('div');
      tileEl.className = 'tile';
      tileEl.dataset.pos = pos;

      if(value === tiles.length - 1){
        tileEl.classList.add('blank');
      } else {
        const homeRow = Math.floor(value / gridSize);
        const homeCol = value % gridSize;
        const pctStep = 100 / (gridSize - 1);
        tileEl.style.backgroundImage = `url(${currentImage})`;
        tileEl.style.backgroundSize = `${gridSize*100}% ${gridSize*100}%`;
        tileEl.style.backgroundPosition = `${homeCol*pctStep}% ${homeRow*pctStep}%`;

        const num = document.createElement('div');
        num.className = 'num';
        num.textContent = value + 1;
        tileEl.appendChild(num);

        const neighbors = getNeighbors(pos, gridSize);
        if(neighbors.includes(blankIndex)){
          tileEl.classList.add('movable');
          attachDrag(tileEl, pos);
        }
      }
      boardEl.appendChild(tileEl);
    });
  }

  function attemptMove(pos){
    if(solved) return;
    const n = gridSize;
    const neighbors = getNeighbors(pos, n);
    if(!neighbors.includes(blankIndex)) return;

    [tiles[pos], tiles[blankIndex]] = [tiles[blankIndex], tiles[pos]];
    blankIndex = pos;
    moves++;
    movesEl.textContent = moves;
    renderBoard();
    checkWin();
  }

  // --- Drag-to-slide support (mouse, touch, pen) ---
  function attachDrag(tileEl, pos){
    let startX = 0, startY = 0;
    let dragging = false;
    let axis = null;     // 'x' or 'y'
    let range = 0;       // signed max travel distance in px (toward the gap)
    let tileSize = 0;

    // figure out which direction leads to the blank gap
    const n = gridSize;
    const row = Math.floor(pos / n), col = pos % n;
    const blankRow = Math.floor(blankIndex / n), blankCol = blankIndex % n;

    function computeDirection(){
      const rect = tileEl.getBoundingClientRect();
      tileSize = rect.width;
      if(blankRow === row){
        axis = 'x';
        range = (blankCol - col) * tileSize; // negative = drag left, positive = drag right
      } else {
        axis = 'y';
        range = (blankRow - row) * tileSize;
      }
    }

    function onPointerDown(e){
      if(solved) return;
      computeDirection();
      startX = e.clientX;
      startY = e.clientY;
      dragging = true;
      tileEl.classList.add('dragging');
      tileEl.setPointerCapture(e.pointerId);
    }

    function onPointerMove(e){
      if(!dragging) return;
      let dx = e.clientX - startX;
      let dy = e.clientY - startY;

      if(axis === 'x'){
        dy = 0;
        dx = range > 0 ? Math.max(0, Math.min(dx, range)) : Math.min(0, Math.max(dx, range));
      } else {
        dx = 0;
        dy = range > 0 ? Math.max(0, Math.min(dy, range)) : Math.min(0, Math.max(dy, range));
      }
      tileEl.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    function onPointerUp(e){
      if(!dragging) return;
      dragging = false;
      tileEl.classList.remove('dragging');

      let dx = e.clientX - startX;
      let dy = e.clientY - startY;
      const moved = axis === 'x' ? dx : dy;
      const threshold = tileSize * 0.3;

      tileEl.style.transform = '';

      if(Math.abs(moved) >= threshold || Math.abs(moved) < 6){
        // committed drag past threshold, OR a simple tap (treat as click)
        attemptMove(pos);
      }
    }

    tileEl.addEventListener('pointerdown', onPointerDown);
    tileEl.addEventListener('pointermove', onPointerMove);
    tileEl.addEventListener('pointerup', onPointerUp);
    tileEl.addEventListener('pointercancel', () => {
      dragging = false;
      tileEl.classList.remove('dragging');
      tileEl.style.transform = '';
    });
  }

  function checkWin(){
    const solvedArr = buildSolvedArray(gridSize);
    const isSolved = tiles.every((v,i) => v === solvedArr[i]);
    if(isSolved){
      solved = true;
      stopTimer();
      winStats.textContent = `Solved a ${gridSize}×${gridSize} in ${moves} moves, ${formatTime(seconds)}.`;
      winOverlay.classList.add('show');
    }
  }

  let easyMode = false;
  const refImg = document.getElementById('refImg');
  const referencePanel = document.getElementById('referencePanel');
  const easyToggle = document.getElementById('easyToggle');

  function updateReference(){
    refImg.src = currentImage;
    referencePanel.classList.toggle('show', easyMode);
  }

  function newGame(){
    solved = false;
    winOverlay.classList.remove('show');
    moves = 0;
    movesEl.textContent = moves;
    currentImage = pickRandomImage();

    const n = gridSize;
    const shuffleCount = n*n*20;
    const { arr, blank } = shuffleFromSolved(n, shuffleCount);
    tiles = arr;
    blankIndex = blank;

    renderBoard();
    startTimer();
    updateReference();
  }

  document.getElementById('sizeGroup').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    document.querySelectorAll('#sizeGroup button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gridSize = parseInt(btn.dataset.size, 10);
    newGame();
  });

  easyToggle.addEventListener('click', () => {
    easyMode = !easyMode;
    easyToggle.classList.toggle('active', easyMode);
    easyToggle.textContent = easyMode ? '👁 EASY MODE: ON' : '👁 EASY MODE: OFF';
    updateReference();
  });

  document.getElementById('newGame').addEventListener('click', newGame);
  document.getElementById('playAgain').addEventListener('click', newGame);

  newGame();
</script>
</body>
</html>
